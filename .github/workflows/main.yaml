name: Build and deploy main
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
jobs:
  test-build-deploy:
    permissions:
      contents: write # for dependency graph
      id-token: write # for nais docker-build-push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Test & build
        run: ./gradlew test installDist
      - name: Build & push docker image + SBOM
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: appsec # TODO: Update to your own team name
          pull: true
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.4.0
  deploy:
    runs-on: ubuntu-latest
    permissions:
        contents: read
        id-token: write
    needs: test-build-deploy
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
